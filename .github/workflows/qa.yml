# ノベルゲームの自動検査（Claude を使わない）。ブラウザで選択肢をランダムに選んで最後まで遊ぶのを繰り返し、
# エラー・止まりを見て、エンディングごとの到達数を「まとめ」（Actions の Summary）に出す。
# プルリクエストで ✅ になれば automerge.yml が自動でマージし、公開まで進める。
name: QA

on:
  pull_request:
    # 下書きを外したときも回す（回らないと自動マージが起きない）
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      games:
        description: '遊ぶ周回数（詳しく見たいときは増やす）'
        default: '60'

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: 自動プレイの検査
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Playwright を入れる
        run: |
          cd qa
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 自動プレイ
        run: node qa/run.mjs --games ${{ inputs.games || '60' }} --out qa-report
      - name: 結果をまとめに出す
        if: always()
        run: test -f qa-report/report.md && cat qa-report/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qa-report
          path: qa-report
          retention-days: 30
