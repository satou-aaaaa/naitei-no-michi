<style>

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.85;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.wrap{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:1.45rem;margin:0;letter-spacing:.03em}
.stats{display:flex;gap:14px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted)}

.ln{margin:0;animation:in .35s ease both}

.stage{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:4px;overflow:hidden;background:#20242c}

.memo-head{display:block;font-size:.72rem;font-weight:700;color:#8a6d00;margin-bottom:4px}
.memo-tag{display:block;font-style:normal;font-size:.72rem;color:var(--ok);margin-top:2px}
.planner,.nego{display:flex;flex-direction:column;gap:8px}
.plan-head{font-weight:700;font-size:.9rem}
.plan-row{display:grid;grid-template-columns:1.6em minmax(0,1fr);align-items:center;gap:8px}
.plan-day{font-weight:700;color:var(--muted);text-align:center}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.seg-b{font:inherit;font-size:.78rem;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px 2px;cursor:pointer}
.seg-b.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.plan-note{margin:0;font-size:.75rem;color:var(--muted)}
.nego-row{display:flex;align-items:center;justify-content:center;gap:16px}
.nego-row .seg-b{width:64px;font-size:1rem}
.nego-val{font-family:var(--mono);font-size:1.1rem}.nego-val b{font-size:1.8rem;font-variant-numeric:tabular-nums}
.chat{align-self:flex-start;background:var(--chat);color:var(--chat-ink);border-radius:14px 14px 14px 4px;padding:8px 14px;max-width:85%;font-size:.92rem;animation:in .35s ease both}
.chat .who{display:block;font-size:.7rem;opacity:.75}
.next{align-self:flex-end;font:inherit;font-size:.85rem;color:var(--muted);background:none;border:none;cursor:pointer;padding:6px 4px}
.next:hover{color:var(--accent)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.choice:hover{border-color:var(--accent)}
.choice small{font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:none;border-radius:6px;padding:12px 16px;cursor:pointer}
.ending{position:relative;display:flex;flex-direction:column;gap:12px;animation:in .5s ease both}
.ending h2{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0;text-wrap:balance}
.ending dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0;font-size:.9rem}
.ending dt{color:var(--muted)} .ending dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.stamp{position:absolute;right:0;top:-4px;font-family:var(--display);color:var(--stamp);border:3px solid var(--stamp);border-radius:50%;width:76px;height:76px;display:grid;place-items:center;transform:rotate(-12deg);font-size:1rem;opacity:.85}
.hint{font-size:.75rem;color:var(--muted);margin:0}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ln,.mail,.chat,.ending,.job,.memo{animation:none}.chara{transition:none}.bar i{transition:none}}
</style>

function lineEl(l){

function step(){
  if(li<lines.length){
    const ln=lines[li++];$("story").appendChild(lineEl(ln));
    if(ln[0]==="LINE"||(val(ln[0])&&!["MAIL","JOB","CODE","MEMO"].includes(ln[0]))) showChara(ln);
    while($("story").children.length>4) $("story").firstChild.remove();
    $("controls").innerHTML=li<lines.length||cur.choices||cur.next?`<div style="display:flex;justify-content:flex-end"><button class="next" id="adv">▼ 次へ</button></div>`:"";
    if($("adv")){$("adv").onclick=e=>{e.stopPropagation();step();};}
    if(li<lines.length) return;
  }
  if(cur.plan) return showPlanner(cur.plan);
  if(cur.nego) return showNego();
  if(cur.choices) return showChoices();
  if(cur.next){$("controls").innerHTML=`<button class="primary" id="adv">次の場面へ</button>`;$("adv").onclick=e=>{e.stopPropagation();go(val(cur.next));};}
}
function showChoices(){
  const cs=cur.choices.filter(c=>!c.if||c.if());
  $("controls").innerHTML=`<div class="choices">${cs.map((c,i)=>`<button class="choice" data-i="${i}"><span>${val(c.t)}${choiceMemo(c)?`<em class="memo-tag">${choiceMemo(c)}</em>`:""}</span>${c.check!=null?`<small>手応え ${Math.round(prob(c,1)*100)}%</small>`:""}</button>`).join("")}</div>`;
  $("controls").querySelectorAll(".choice").forEach(b=>b.onclick=e=>{
    e.stopPropagation();const c=cs[+b.dataset.i];
    if(c.fx) add(c.fx);

  $("controls").querySelector(".choice").focus({preventScroll:true});
}

function showNego(){
  const base=S.salary;let ask=base+30;
  const draw=()=>{$("ask").textContent=ask;$("diff").textContent=(ask-base>=0?"+":"")+(ask-base)+"万円";};
  $("controls").innerHTML=`<div class="nego"><div class="nego-row"><button class="seg-b" id="m10" aria-label="10万円下げる">−10</button><span class="nego-val"><b id="ask"></b>万円</span><button class="seg-b" id="p10" aria-label="10万円上げる">＋10</button></div><p class="plan-note">提示額との差：<span id="diff"></span></p><button class="primary" id="adv">この金額で伝える</button></div>`;
  draw();
  $("m10").onclick=e=>{e.stopPropagation();ask=Math.max(base,ask-10);draw();};
  $("p10").onclick=e=>{e.stopPropagation();ask=Math.min(base+200,ask+10);draw();};
  $("adv").onclick=e=>{e.stopPropagation();
    const d=ask-base,held=S.side&&S.side.status==="held";
    const limit=15+S.prep*4+S.conf*2+(held?Math.max(0,S.side.salary-base)+20:0)+(route()==="draft"&&!S.flags.tookSide?15:0)+(S.flags.askM?10:0);
    if(d<=0) S.tmp="結局、提示額のままでお願いした。";
    else if(d<=limit){S.salary=ask;S.tmp=`数日後、「${ask}万円でお受けします」と返ってきた。言ってみるものだ。`;add({conf:1});}
    else if(d<=limit+50){const mid=base+Math.round(limit/20)*10;S.salary=Math.max(base,mid);S.tmp=S.salary>base?`「${ask}万円は難しいですが、${S.salary}万円なら」と返ってきた。落としどころとしては悪くない。`:"「今回は規定どおりで」と返ってきた。少し強気すぎたかもしれない。";}
    else {S.salary=base-10;add({conf:-2});S.tmp=`「その金額は、今回のポジションでは難しいです」。条件の再提示では、手当が少し減って${S.salary}万円になった。`;}
    go("offer_result");};
}

   <dl>${won?`<dt>入社先</dt><dd>${co()}</dd>`:""}${won?`<dt>年収の変化</dt><dd>${S.cur}万円 → ${S.salary}万円</dd>`:""}<dt>お祈りメール</dt><dd>${S.rejects}通</dd></dl><span class="place">エンディング回収 ${got.length} / ${ENDS.length}</span>${S.unlock?"":`<p class="plan-note">2周目からは、不採用のときに面接官の評価メモが読めます。メモで知った社風は、選択肢に表示されます。</p>`}<ul class="gallery">${ENDS.map(([k,n])=>`<li class="${got.includes(k)?"got":""}">${got.includes(k)?n:"？？？"}</li>`).join("")}</ul></div>`;
  $("controls").innerHTML=`<button class="primary" id="again">はじめから遊ぶ</button>`;
  $("again").onclick=e2=>{e2.stopPropagation();reset();};
}
function reset(){S=JSON.parse(JSON.stringify(START));const nt=store("naitei-notes");if(nt){S.notes=nt;S.notes.cult=S.notes.cult||{};S.notes.code=S.notes.code||{};}S.unlock=(store("naitei-endings")||[]).length>0?1:0;if(S.notes.runs) add({prep:1});go("start");}
const ENDS=[["end_new","新しい名刺"],["end_stay","据え置き"],["end_decline","見送り"],["end_rest","小休止"]];
function store(k,v){try{if(v===undefined) return JSON.parse(localStorage.getItem(k)||"null");if(v===null) localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
function save(id){store("naitei-save",id?{id,S}:null);}
function markEnding(id){const g=store("naitei-endings")||[];if(!g.includes(id)) g.push(id);store("naitei-endings",g);return g;}
function boot(){
  const sv=store("naitei-save");
  if(!sv||!SC[sv.id]) return reset();
  S=Object.assign(JSON.parse(JSON.stringify(START)),sv.S);
  $("chapter").textContent="つづきから";$("place").textContent="";setScene("自宅");
  $("story").innerHTML=`<p class="ln narr">前回の続きがあります。（${SC[sv.id].ch}）</p>`;
  $("controls").innerHTML=`<div class="resume"><button class="primary" id="cont">続きから遊ぶ</button><button class="choice" id="fresh"><span>はじめから遊ぶ</span></button></div>`;
  $("cont").onclick=e=>{e.stopPropagation();go(sv.id);};
  $("fresh").onclick=e=>{e.stopPropagation();reset();};
}
$("page").addEventListener("click",()=>{if($("adv")&&$("adv").classList.contains("next"))step();});
document.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&document.activeElement===document.body&&$("adv")){e.preventDefault();$("adv").click();}
});
boot();
</script>
